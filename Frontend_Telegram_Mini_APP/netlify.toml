# Frontend_Telegram_Mini_APP on Netlify
# Import the GitHub repo in Netlify - settings below are used automatically.

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"

# Route Telegram Mini App API calls through Rovistar's production API.
[[redirects]]
  from = "/api/*"
  to = "https://api.rovistar.shop/api/:splat"
  status = 200

# SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the app shell.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# Versioned assets are cacheable.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

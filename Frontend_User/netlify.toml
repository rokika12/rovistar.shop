[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # Production API is served from Rovistar's own subdomain.
  REACT_APP_API_URL = "https://api.rovistar.shop"
  REACT_APP_ADMIN_URL = "https://admin.rovistar.shop/shops"
  REACT_APP_DASHBOARD_URL = "https://dashboard.rovistar.shop/"
  REACT_APP_ALLOW_PUBLIC_SHOP_REGISTRATION = "true"
  CI = "false"

# SPA fallback: serve index.html for all client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

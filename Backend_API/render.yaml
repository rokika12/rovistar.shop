# Render.com web service - ROKIKA SHOP Backend API
# Deploy: push this file to GitHub, then in Render -> New + -> Web Service -> connect repo -> select this render.yaml

services:
  - type: web
    name: rokika-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: rokika-db
          property: connectionString
      - key: MINISHOP_SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://rovistar.shop,https://www.rovistar.shop,https://admin.rovistar.shop,https://dashboard.rovistar.shop,https://telegram.rovistar.shop
      - key: BASE_URL
        value: https://www.rovistar.shop
      - key: DASHBOARD_URL
        value: https://dashboard.rovistar.shop/
      - key: ALLOW_PUBLIC_SHOP_REGISTRATION
        value: true
      - key: PUBLIC_REGISTRATION_REQUIRES_PAYMENT
        value: true
      - key: TELEGRAM_ADMIN_URL
        value: https://t.me/ROVISTARCAMBO
      - key: API_URL
        value: https://rokika-api.onrender.com
      - key: PLATFORM_SHOP_USERNAME
        value: demo
      - key: REFERRAL_SECRET
        generateValue: true

databases:
  - name: rokika-db
    plan: free
    databaseName: rokikadb
    user: rokika